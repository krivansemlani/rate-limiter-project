  app1:
    build: .
    ports:
      - "8001:8000"
    depends_on:
      - redis

  app2:
    build: .
    ports:
      - "8002:8000"
    depends_on:
      - redis

  app3:
    build: .
    ports:
      - "8003:8000"
    depends_on:
      - redis