version: '3'
services:
  redis:
    image: redis
    ports:
      - "6379:6379"

  app1:
    build: .
    ports:
      - "8001:8000"
    depends_on:
      - redis

  app2:
    build: .
    ports:
      - "8002:8000"
    depends_on:
      - redis

  app3:
    build: .
    ports:
      - "8003:8000"
    depends_on:
      - redis
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - app1
      - app2
      - app3

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus